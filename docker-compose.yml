services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scadenzario
      POSTGRES_PASSWORD: scadenzario
      POSTGRES_DB: scadenzario
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scadenzario"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://scadenzario:scadenzario@db:5432/scadenzario
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

volumes:
  db_data:
